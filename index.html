<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Quản Lý Phòng Khám - Bán Thuốc</title>
    <!-- Tailwind CSS để làm giao diện nhanh, đẹp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-4 max-w-6xl">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">Quản Lý Phòng Khám - Bán Thuốc</h1>

        <!-- Khung cấu hình Supabase nhanh -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-2">Cấu hình kết nối Supabase</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="supabaseUrl" placeholder="Supabase URL" class="border p-2 rounded w-full">
                <input type="text" id="supabaseKey" placeholder="Supabase Anon Key" class="border p-2 rounded w-full">
            </div>
            <button onclick="initSupabase()" class="mt-3 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Kết nối</button>
        </div>

        <!-- Khu vực bán thuốc -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-4">Lập Đơn Bán Thuốc</h2>
            
            <!-- Ô tìm kiếm thuốc -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tìm kiếm thuốc</label>
                <input type="text" id="searchKeyword" placeholder="Nhập tên thuốc..." class="border p-2 rounded w-full" oninput="handleSearch(this.value)">
                
                <!-- Kết quả tìm kiếm gợi ý -->
                <div id="searchResults" class="bg-white border rounded shadow mt-1 max-h-40 overflow-y-auto hidden"></div>
            </div>

            <!-- Bảng danh sách thuốc đã chọn trong đơn -->
            <div class="overflow-x-auto mb-4">
                <table class="w-full border-collapse border border-gray-200">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border p-2 text-left">Tên thuốc</th>
                            <th class="border p-2 text-center">ĐVT</th>
                            <th class="border p-2 text-center">Số lượng</th>
                            <th class="border p-2 text-right">Đơn giá</th>
                            <th class="border p-2 text-right">Thành tiền</th>
                            <th class="border p-2 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <tr>
                            <td colspan="6" class="text-center p-4 text-gray-400">Chưa có thuốc nào trong đơn</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Tổng kết tiền -->
            <div class="flex justify-between items-center border-t pt-4">
                <div class="text-xl font-bold">
                    Tổng tiền: <span id="totalAmount" class="text-red-600">0 đ</span>
                </div>
                <button onclick="alert('Tính năng thanh toán đang phát triển')" class="bg-green-600 text-white px-6 py-2 rounded font-semibold hover:bg-green-700">
                    Thanh Toán & In Đơn
                </button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;

        function initSupabase() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            if (!url || !key) {
                alert('Vui lòng nhập đầy đủ URL và Anon Key!');
                return;
            }
            supabaseClient = supabase.createClient(url, key);
            alert('Kết nối Supabase thành công!');
        }

        async function handleSearch(keyword) {
            if (!supabaseClient) {
                return;
            }
            if (!keyword.trim()) {
                document.getElementById('searchResults').classList.add('hidden');
                return;
            }

            const { data, error } = await supabaseClient
                .from('medicines')
                .select('*')
                .ilike('name', `%${keyword}%`)
                .limit(5);

            const resultsDiv = document.getElementById('searchResults');
            if (error || !data || data.length === 0) {
                resultsDiv.innerHTML = '<div class="p-2 text-gray-500">Không tìm thấy thuốc</div>';
                resultsDiv.classList.remove('hidden');
                return;
            }

            resultsDiv.innerHTML = data.map(med => `
                <div class="p-2 hover:bg-gray-100 cursor-pointer border-b" onclick='selectMedicine(${JSON.stringify(med)})'>
                    <strong>${med.name}</strong> - Giá: ${med.selling_price}đ (Tồn: ${med.unit})
                </div>
            `).join('');
            resultsDiv.classList.remove('hidden');
        }

        function selectMedicine(med) {
            alert('Đã chọn thuốc: ' + med.name);
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchKeyword').value = '';
            // Sau này chúng ta sẽ viết tiếp hàm đưa vào giỏ hàng ở đây
        }
    </script>
</body>
</html>
