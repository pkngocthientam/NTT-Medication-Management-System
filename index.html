<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phòng Khám - Nhập Thuốc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-4 max-w-6xl">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">Quản Lý Phòng Khám - Kho & Nhập Thuốc</h1>

        <!-- Khung cấu hình Supabase -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-2">Cấu hình kết nối Supabase</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="supabaseUrl" placeholder="Supabase URL" class="border p-2 rounded w-full">
                <input type="text" id="supabaseKey" placeholder="Supabase Anon Key" class="border p-2 rounded w-full">
            </div>
            <button onclick="initSupabase()" class="mt-3 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Kết nối</button>
        </div>

        <!-- Form Nhập Thuốc / Thêm Lô Mới -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-4 text-green-600">📦 Nhập Lô Thuốc Mới Vào Kho</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mã thuốc</label>
                    <input type="text" id="medCode" placeholder="VD: PANO01" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên thuốc</label>
                    <input type="text" id="medName" placeholder="VD: Paracetamol 500mg" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Đơn vị tính</label>
                    <input type="text" id="medUnit" placeholder="VD: Viên, Hộp, Vỉ" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số lô</label>
                    <input type="text" id="batchNumber" placeholder="VD: LOT2026A" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hạn sử dụng</label>
                    <input type="date" id="expiryDate" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số lượng nhập</label>
                    <input type="number" id="quantityImported" placeholder="VD: 100" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá nhập (đ)</label>
                    <input type="number" id="importPrice" placeholder="VD: 5000" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá bán lẻ (đ)</label>
                    <input type="number" id="sellingPrice" placeholder="VD: 7000" class="border p-2 rounded w-full">
                </div>
            </div>

            <button onclick="handleImportMedicine()" class="bg-green-600 text-white px-6 py-2 rounded font-semibold hover:bg-green-700">
                Xác Nhận Nhập Kho
            </button>
        </div>
    </div>

    <script>
        let supabaseClient = null;

        function initSupabase() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            if (!url || !key) {
                alert('Vui lòng nhập đầy đủ URL và Anon Key!');
                return;
            }
            supabaseClient = supabase.createClient(url, key);
            alert('Kết nối Supabase thành công!');
        }

        async function handleImportMedicine() {
            if (!supabaseClient) {
                alert('Vui lòng kết nối Supabase trước!');
                return;
            }

            const code = document.getElementById('medCode').value.trim();
            const name = document.getElementById('medName').value.trim();
            const unit = document.getElementById('medUnit').value.trim();
            const batch_number = document.getElementById('batchNumber').value.trim();
            const expiry_date = document.getElementById('expiryDate').value;
            const quantity = parseInt(document.getElementById('quantityImported').value);
            const import_price = parseFloat(document.getElementById('importPrice').value) || 0;
            const selling_price = parseFloat(document.getElementById('sellingPrice').value) || 0;

            if (!code || !name || !unit || !batch_number || !expiry_date || isNaN(quantity)) {
                alert('Vui lòng điền đầy đủ thông tin bắt buộc!');
                return;
            }

            try {
                // Bước 1: Kiểm tra xem thuốc đã tồn tại trong bảng medicines chưa
                let { data: existingMed, error: findError } = await supabaseClient
                    .from('medicines')
                    .select('id')
                    .eq('code', code)
                    .maybeSingle();

                if (findError) throw findError;

                let medicineId;

                if (existingMed) {
                    // Nếu thuốc đã có -> lấy ID cũ
                    medicineId = existingMed.id;
                    // Cập nhật lại giá bán mới nhất nếu cần
                    await supabaseClient
                        .from('medicines')
                        .update({ selling_price: selling_price })
                        .eq('id', medicineId);
                } else {
                    // Nếu thuốc chưa có -> Tạo mới trong bảng medicines
                    const { data: newMed, error: insertMedError } = await supabaseClient
                        .from('medicines')
                        .insert([{ code, name, unit, selling_price, cost_price: import_price }])
                        .select('id')
                        .single();

                    if (insertMedError) throw insertMedError;
                    medicineId = newMed.id;
                }

                // Bước 2: Thêm lô hàng vào bảng inventory_batches
                const { error: batchError } = await supabaseClient
                    .from('inventory_batches')
                    .insert([{
                        medicine_id: medicineId,
                        batch_number: batch_number,
                        expiry_date: expiry_date,
                        quantity_imported: quantity,
                        quantity_remaining: quantity, // Lúc mới nhập thì tồn = số lượng nhập
                        import_price: import_price
                    }]);

                if (batchError) throw batchError;

                alert('Nhập kho thành công!');
                // Reset form
                document.getElementById('medCode').value = '';
                document.getElementById('medName').value = '';
                document.getElementById('medUnit').value = '';
                document.getElementById('batchNumber').value = '';
                document.getElementById('expiryDate').value = '';
                document.getElementById('quantityImported').value = '';
                document.getElementById('importPrice').value = '';
                document.getElementById('sellingPrice').value = '';

            } catch (error) {
                alert('Lỗi khi nhập kho: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
